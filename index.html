<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista de Tarefas</title>
</head>
<body>
    <div id="root"></div>
    
    <script src="https://unpkg.com/@tailwindcss/browser@4"></script>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <script type="text/babel">

        function Text({ 
            as = "span",
            className,
            children,
            ...props 
        }) {
            return React.createElement(
                as,
                {
                    className:`${className ? className : ''}`,
                    ...props
                },
                children
            )
        }

        const TaskContext = React.createContext();
        function TaskProvider({ children }) {
            const [ task, setTask ] = React.useState('');
            const [ tasks, setTasks ] = React.useState([]);

            function addTask() {
                setTasks(prev => {
                    const nextId = prev.length === 0 
                    ? 1 
                    : prev.at(-1).id + 1;

                return [
                        ...prev, 
                    {   
                        id: nextId,
                        title: task,
                        completed: false
                    }
                ];
            });
            setTask('');
            }

            function toggleTask(id) {
                setTasks(tasks.map(task => 
                        task.id === id 
                        ? { ...task, completed: !task.completed }
                        : task
                    )
                );
            }

            function removeTask(id) {
                setTasks(prev =>
                    prev.filter(task => task.id !== id)
                );
            }

            React.useEffect(() => {
                console.log(tasks)
            }, [tasks])

            return (
                <TaskContext.Provider
                    value={{
                        task,
                        setTask,
                        tasks,
                        setTasks,
                        addTask,
                        toggleTask,
                        removeTask
                    }}
                >
                {children}
                </TaskContext.Provider>
            )
            
        }

        function DisplayAddTask() {
            const { task, setTask, addTask, clearInput } = React.useContext(TaskContext);

            return (
                    <Text as='div' className='flex flex-col gap-3'>
                        <Text 
                            as='input'
                            placeholder='Tarefa'
                            className="bg-gray-100 p-3 rounded-sm"
                            value={task}
                            onChange={(e) => setTask(e.target.value)}
                        />
                        <Text as='div' className='flex gap-6'>
                            <Text
                                as='button'
                                className="bg-[#F2E5EF] p-2 cursor-pointer w-1/2
                                     rounded-sm hover:bg-[#e2d3df]"
                                onClick={addTask}
                            >
                                Adicionar
                            </Text>
                            <Text
                                as='button'
                                className="bg-[#F2E5EF] p-2 cursor-pointer w-1/2
                                     rounded-sm hover:bg-[#e2d3df]"
                                onClick={() => setTask('')}
                            >
                                Limpar
                            </Text>
                        </Text>
                    </Text>
            )
        }

        function ListDisplay() {
            const [ show, setShow ] = React.useState(false);

            return (
                <Text as='div' className='
                    bg-white flex flex-col justify-center items-center
                    h-min w-96 text-center p-8 rounded-lg gap-4
                '>
                    <Text as='div' className="flex flex-col gap-6">
                        <Text 
                            as='button'
                            className='bg-[#e1f0e4] p-3 w-80 cursor-pointer
                                 rounded-sm hover:bg-[#d3e4d6]'
                            onClick={() => setShow(!show)}
                            >
                            Nova Tarefa
                        </Text>
                        {show && <DisplayAddTask/>}
                    </Text>
                </Text>
            )
        }

        function TaskList() {
            const { tasks, toggleTask, removeTask } = React.useContext(TaskContext);

            return (
                <Text as='div' className='
                    mr-auto ml-auto rounded-lg p-4 
                '>
                    <Text as='ul'>
                        {tasks.map((task, index) => (
                            <Text as='div' key={`${index}-${task}`}
                            className='
                                bg-white max-w-96 min-w-96 p-4 rounded-lg mt-1
                                flex gap-2
                            '>
                                <Text as='input'
                                    type='checkbox'
                                    onChange={() => toggleTask(task.id)}
                                    className='hover:cursor-pointer accent-green-600'
                                />
                                    <Text as='span' 
                                        className={`
                                            max-w-74 break-words
                                            ${task.completed ? 'line-through text-green-800' : ''}`}
                                    >
                                        {task.title}
                                    </Text>
                                <Text 
                                    as='button' 
                                    onClick={() => removeTask(task.id)}
                                    className='ml-auto hover:cursor-pointer'
                                    >
                                        🗑️
                                    </Text>
                            </Text>
                        ))}
                    </Text>
                </Text>
            )
        }

        function Title() {
            const { tasks } = React.useContext(TaskContext);

            return (
                <Text 
                    as='div'
                    className='rounded w-80 p-2 flex flex-col gap-4'
                >
                    <Text 
                        as='h1'
                        className='text-center text-2xl font-bold'
                    >
                        Lista de Tarefas
                    </Text>
                    <Text 
                        as='div'
                        className='flex justify-between'
                    >
                        <Text 
                            as='p'
                            className='font-medium'
                        >
                            Tarefas
                            <Text 
                                as='span'
                                className='bg-blue-200 rounded-full ml-1 pl-1 pr-1 font-bold'
                            >
                                {tasks.length}
                            </Text> 
                        </Text>
                        <Text 
                            as='p'
                            className='font-medium'
                        >
                            Concluídas 
                            <Text 
                                as='span'
                                className='bg-green-300 rounded-full ml-1 pl-2 pr-2 font-bold'
                            >
                                {tasks.filter(task => task.completed).length} de {tasks.length}
                            </Text>
                        </Text>
                    </Text>
                </Text>
            )
        }

        function App() {
            return (
                <main className='
                    bg-[#F8F3F7] min-h-screen w-full flex
                    flex-col justify-center items-center gap-3 p-4
                '>
                    <TaskProvider>
                        <Title/>
                        <ListDisplay/>
                        <TaskList/>
                    </TaskProvider>
                </main>
            )
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />)
    </script>
</body>
</html>
